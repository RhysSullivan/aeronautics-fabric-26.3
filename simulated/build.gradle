plugins {
    id 'java-library'
    id 'net.fabricmc.fabric-loom'
}

apply from: rootProject.file('gradle/fabric-module.gradle')

loom {
    runs {
        datagen {
            inherit server
            name = 'Simulated Fabric Data Generation'
            runDir = 'runs/datagen'
            vmArg '-Dfabric-api.datagen'
            vmArg "-Dfabric-api.datagen.output-dir=${file('src/generated/resources').absolutePath}"
            vmArg '-Dfabric-api.datagen.modid=simulated'
        }
    }
}

// Porting Lib: vendored sources in :portinglib (LGPL-3.0) replace the 1.21.1 jars and their bytecode patching.


dependencies {
    implementation project(':portinglib')
    include project(':portinglib')
    implementation(project(path: ':sable')) {
        transitive = false
    }
    runtimeOnly("dev.ryanhcode.sable-companion:sable-companion-common-1.21.1:${sable_companion_version}") {
        transitive = false
    }
    include(implementation("teamreborn:energy:${energy_version}"))
}

// PORT-26.3: no upstream assets in this jar (they are All Rights Reserved); the game reads them from the official
// release jar at runtime (simulated: dev.simulated_team.simulated.port.assets).
tasks.named('jar', Jar) {
    duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    exclude 'assets/**'

}
